:root {

}
@media (prefers-color-scheme: dark) {

    --code: #6cc7b8; --code-bg: #182e2b; --mkt: #e2ac62; --mkt-bg: #33281a;
    --out: #e8ecf0; --out-fg: #12171d; color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #12171d; --panel: #1a2129; --ink: #e8ecf0; --muted: #9aa5b1; --edge: #6b7784; --rule: #26303a;
  --user: #8fb0d9; --user-bg: #1f2b3a; --llm: #d39ac6; --llm-bg: #33232f;
  --code: #6cc7b8; --code-bg: #182e2b; --mkt: #e2ac62; --mkt-bg: #33281a;
  --out: #e8ecf0; --out-fg: #12171d; color-scheme: dark;
}
* { box-sizing: border-box; }
body {
  background: var(--bg); color: var(--ink); font-family: var(--body); font-size: 15px; line-height: 1.4;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  padding-block: 36px 48px;
}
.wrap { max-width: 1260px; margin: 0 auto; display: grid; gap: 22px; }
header { display: flex; flex-wrap: wrap; align-items: flex-end; justify-content: space-between; gap: 14px 32px; }
h1 { font-family: var(--display); font-weight: 700; font-size: 27px; letter-spacing: -0.01em; margin: 0; text-wrap: balance; }
.sub { color: var(--muted); margin: 6px 0 0; }
.legend { display: flex; flex-wrap: wrap; gap: 8px 18px; font-size: 13px; color: var(--muted); }
.legend span { display: inline-flex; align-items: center; gap: 7px; }
.legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.canvas { background: var(--panel); border: 1px solid var(--rule); border-radius: 12px; padding: 18px; overflow-x: auto; }
.canvas svg { display: block; width: 100%; min-width: 920px; height: auto; }

.edge { fill: none; stroke: var(--edge); stroke-width: 1.6; stroke-linejoin: round; }
.edge.dash { stroke-dasharray: 5 4; }
.ahp { fill: var(--edge); }
.dot { fill: var(--edge); }
.grpbox { fill: none; stroke: var(--edge); stroke-width: 1.2; stroke-dasharray: 3 4; opacity: .7; }
.frame { fill: none; stroke: var(--rule); stroke-width: 1.5; stroke-dasharray: 6 5; }
.sec { font-family: var(--display); font-weight: 700; font-size: 15px; letter-spacing: .08em; fill: var(--ink); }
.grp { font-family: var(--body); font-weight: 600; font-size: 13px; fill: var(--muted); }
.lbl { font-family: var(--body); font-size: 12.5px; font-style: italic; fill: var(--muted);
       paint-order: stroke; stroke: var(--panel); stroke-width: 5px; stroke-linejoin: round; }
.node rect { stroke-width: 1.6; }
.node .t { font-family: var(--display); font-weight: 600; font-size: 14.5px; }
.node .s { font-family: var(--body); font-size: 12.5px; fill: var(--muted); }
.node.user rect { fill: var(--user-bg); stroke: var(--user); } .node.user .t { fill: var(--user); }
.node.llm rect { fill: var(--llm-bg); stroke: var(--llm); }   .node.llm .t { fill: var(--llm); }
.node.code rect { fill: var(--code-bg); stroke: var(--code); } .node.code .t { fill: var(--code); }
.node.mkt rect { fill: var(--mkt-bg); stroke: var(--mkt); }   .node.mkt .t { fill: var(--mkt); }
.node.out rect { fill: var(--out); stroke: var(--out); }      .node.out .t { fill: var(--out-fg); }
.node.out .s { fill: var(--out-fg); opacity: .72; }
.node .fn { font-family: "IBM Plex Mono", ui-monospace, Menlo, Consolas, monospace; font-size: 11.5px; fill: var(--muted); opacity: .9; }
.node.out .fn { fill: var(--out-fg); opacity: .6; }
</style>
